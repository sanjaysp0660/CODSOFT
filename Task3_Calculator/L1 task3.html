<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Dev Assignment 1 - Sanjay'sCalculator</title>
    <style>
        
        body {
            background-color: #eaeaea;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        
        .calculator-box {
            background-color: #2196F3; 
            width: 320px;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
        }

        
        .calc-screen {
            background-color: #ffffff;
            height: 70px;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
            border: none;
            box-sizing: border-box;
            font-size: 36px;
            text-align: right;
            padding: 15px;
            color: #000000;
        }


        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        
        button {
            background-color: #1565C0; 
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: none;
            padding: 18px 0;
            border-radius: 12px;
            cursor: pointer;
        }

        
        button:hover {
            background-color: #1976D2;
        }

        
        .zero-btn {
            grid-column: span 2;
        }

        .equals-btn {
            grid-row: span 2;
            background-color: #0d47a1; 
        }

        .clear-btn {
            background-color: #d32f2f;
        }
        .clear-btn:hover {
            background-color: #f44336;
        }
    </style>
</head>
<body>

    <div class="calculator-box">
        <input type="text" class="calc-screen" id="display" value="0" readonly>
        
        <div class="grid-container">
            <button class="clear-btn" onclick="pressClear()">C</button>
            <button onclick="pressOp('/')">/</button>
            <button onclick="pressOp('*')">*</button>
            <button onclick="pressOp('-')">-</button>
            
            <button onclick="pressNum('7')">7</button>
            <button onclick="pressNum('8')">8</button>
            <button onclick="pressNum('9')">9</button>
            <button onclick="pressOp('+')">+</button>
            
            <button onclick="pressNum('4')">4</button>
            <button onclick="pressNum('5')">5</button>
            <button onclick="pressNum('6')">6</button>
            <button class="equals-btn" onclick="pressEquals()">=</button>
            
            <button onclick="pressNum('1')">1</button>
            <button onclick="pressNum('2')">2</button>
            <button onclick="pressNum('3')">3</button>
            
            <button class="zero-btn" onclick="pressNum('0')">0</button>
            <button onclick="pressNum('.')">.</button>
        </div>
    </div>

    <script>
        
        var screenElement = document.getElementById("display");
        var currentExpression = "";
        var resetOnNextKey = false;

        
        function pressNum(num) {
            
            if (resetOnNextKey) {
                currentExpression = "";
                resetOnNextKey = false;
            }

            
            if (currentExpression === "0" && num !== ".") {
                currentExpression = num;
            } else {
                currentExpression += num;
            }
            
            screenElement.value = currentExpression;
        }

        
        function pressOp(operator) {
            resetOnNextKey = false;
            
            
            var lastChar = currentExpression.substring(currentExpression.length - 1);
            if (lastChar === "+" || lastChar === "-" || lastChar === "*" || lastChar === "/") {
                return; 
            }
            
            if (currentExpression !== "") {
                currentExpression += operator;
                screenElement.value = currentExpression;
            }
        }

        
        function pressEquals() {
            if (currentExpression === "") {
                return;
            }
            
            try {
                
                var result = eval(currentExpression);
                
                
                if (result === Infinity || result === -Infinity) {
                    screenElement.value = "Error";
                    currentExpression = "";
                } else {
                    screenElement.value = result;
                    currentExpression = result.toString();
                    resetOnNextKey = true; 
                }
            } catch (err) {
                screenElement.value = "Error";
                currentExpression = "";
            }
        }

        
        function pressClear() {
            currentExpression = "";
            screenElement.value = "0";
            resetOnNextKey = false;
        }
    </script>
</body>
</html>
