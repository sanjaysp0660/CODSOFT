<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | SANJAY SP Portfolio</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
        body { background:#f5f5f5; color:#222; min-height:100vh; }
        header { width:100%; background:#1f1f1f; padding:20px 40px; display:flex; justify-content:space-between; align-items:center; }
        .logo h1 { color:white; font-size:28px; }
        nav ul { list-style:none; display:flex; gap:18px; }
        nav a { text-decoration:none; color:white; font-weight:bold; transition:0.3s; }
        nav a:hover { color:#4da6ff; }
        .hero { padding:120px 40px 60px; display:flex; justify-content:center; }
        .login-card { width:100%; max-width:520px; background:white; border-radius:16px; padding:40px; box-shadow:0 10px 30px rgba(0,0,0,0.12); }
        .login-card h2 { margin-bottom:16px; color:#1e90ff; }
        .login-card p { margin-bottom:24px; line-height:1.8; color:#555; }
        .login-card label { display:block; margin-bottom:10px; font-weight:bold; color:#333; }
        .login-card input { width:100%; padding:14px 16px; margin-bottom:18px; border:1px solid #ccc; border-radius:8px; }
        .login-card button { width:100%; padding:15px; border:none; border-radius:8px; background:#1e90ff; color:white; font-size:16px; cursor:pointer; }
        .login-card button:hover { background:#0066cc; }
        .login-card .link-row { margin-top:18px; display:flex; justify-content:space-between; align-items:center; }
        .login-card .link-row a { color:#1e90ff; text-decoration:none; }
        .message { margin-top:20px; padding:16px; border-radius:10px; display:none; }
        .message.success { background:#e6f7ed; color:#0a3d0a; }
        .message.error { background:#fde9e6; color:#a43727; }
        @media(max-width:700px) { header { flex-direction:column; gap:12px; } .hero { padding-top:140px; } }
    </style>
</head>
<body>
    <header>
        <div class="logo"><h1>Portfolio Access</h1></div>
        <nav>
            <ul>
                <li><a href="level 1 task 1 internship.html">HOME</a></li>
                <li><a href="services.html">SERVICES</a></li>
                <li><a href="dashboard.html">DASHBOARD</a></li>
                <li><a href="project1.html">PROJECT 1</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero">
        <div class="login-card">
            <h2>Login to Dashboard</h2>
            <p>Sign in to unlock the internship dashboard and access user-specific project insights.</p>
            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter a password" required>
                <button type="submit">Sign In</button>
            </form>
            <div id="login-message" class="message"></div>
            <div class="link-row">
                <a href="level 1 task 1 internship.html">Back to Portfolio</a>
                <a href="dashboard.html">Go to Dashboard</a>
            </div>
        </div>
    </section>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('login-form');
            const message = document.getElementById('login-message');
            const loggedIn = localStorage.getItem('portfolioLoggedIn');
            if (loggedIn === 'true') {
                message.textContent = 'You are already logged in. Access the dashboard directly.';
                message.className = 'message success';
                message.style.display = 'block';
            }
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                if (!email || !password) {
                    message.textContent = 'Please enter both email and password.';
                    message.className = 'message error';
                    message.style.display = 'block';
                    return;
                }
                localStorage.setItem('portfolioLoggedIn', 'true');
                localStorage.setItem('portfolioUserEmail', email);
                message.textContent = 'Login successful. Redirecting to dashboard…';
                message.className = 'message success';
                message.style.display = 'block';
                setTimeout(function () { window.location.href = 'dashboard.html'; }, 900);
            });
        });
    </script>
</body>
</html>
